<style>

  color-scheme:dark } }

  --bg:#0e100e; --surface:#1a1a19; --sunk:#232522; --ink:#f1f3ef; --ink2:#c0c5bc; --muted:#8b9188;
  --line:#2d302c; --axis:#3b3f39; --accent:#5fbf9b; --accent-ink:#07140e; --accent-soft:#1d3229;
  --pos:#3fc13f; --neg:#ef7b72; --warn-bg:#332a10; --warn-ink:#f1d488; --warn-line:#5c4c1c;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;

.seg.sub{flex-wrap:wrap}

td select.cat{font-size:13px;padding:2px 4px;max-width:150px}

ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;max-width:68ch}

@media (prefers-reduced-motion:no-preference){button,.drop{transition:background .12s,border-color .12s}}

<div class="app">
  <header class="top">
    <div><h1>Net Worth Ledger</h1></div>

  </header>
  <nav class="tabs" role="tablist" id="tabs">

<script>
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const dayNum=iso=>Math.round(Date.UTC(+iso.slice(0,4),+iso.slice(5,7)-1,+iso.slice(8,10))/864e5);
const isoOf=n=>new Date(n*864e5).toISOString().slice(0,10);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate=iso=>iso?`${MON[+iso.slice(5,7)-1]} ${+iso.slice(8,10)}, ${iso.slice(0,4)}`:'';
const money=(c,sign)=>{const v=Math.abs(c)/100;const s=v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});return (c<0?'-':(sign&&c>0?'+':''))+'$'+s;};
const compact=c=>{const v=c/100,a=Math.abs(v);const s=a>=1e6?(a/1e6).toFixed(a%1e6?2:0).replace(/\.?0+$/,'')+'M':a>=1e3?(a/1e3).toFixed(a%1e3?1:0).replace(/\.0$/,'')+'k':String(Math.round(a));return (v<0?'-':'')+'$'+s;};
const TYPES={checking:'Checking',savings:'Savings',credit:'Credit card',brokerage:'Brokerage',loan:'Loan',property:'Property',other:'Other asset'};
const isLiab=a=>a.type==='credit'||a.type==='loan';
const ROLES={ignore:'Ignore',date:'Transaction date',postDate:'Posting date',desc:'Description',amount:'Amount',debit:'Money out',credit:'Money in',balance:'Running balance',category:'Category',type:'Type',memo:'Memo',person:'Card member',symbol:'Symbol',quantity:'Quantity',price:'Price'};
const SERIES=['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8'];

/* ---------- parsing ---------- */
function parseCSV(text){
  text=text.replace(/^﻿/,'');
  const first=text.slice(0,text.indexOf('\n')>0?text.indexOf('\n'):text.length);
  const cnt=ch=>first.split(ch).length-1;
  const delim=cnt('\t')>cnt(',')&&cnt('\t')>cnt(';')?'\t':cnt(';')>cnt(',')?';':',';
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;
    else if(c===delim){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);f='';rows.push(row);row=[];}
    else f+=c;}
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}
function parseDate(s,fmt){
  s=String(s||'').trim();if(!s)return null;let y,m,d,x;
  if((x=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))){y=+x[1];m=+x[2];d=+x[3];}
  else if((x=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))){const a=+x[1],b=+x[2];y=+x[3];if(y<100)y+=y>70?1900:2000;if(fmt==='dmy'){d=a;m=b;}else{m=a;d=b;}}
  else if(/[A-Za-z]{3}/.test(s)){const t=new Date(s);if(isNaN(t))return null;y=t.getFullYear();m=t.getMonth()+1;d=t.getDate();}
  else return null;
  if(!(m>=1&&m<=12&&d>=1&&d<=31&&y>1900&&y<2200))return null;
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function detectFmt(vals){for(const v of vals){const x=String(v).trim().match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.]\d{2,4}/);if(x&&+x[1]>12)return 'dmy';}return 'mdy';}
function parseAmt(s){
  s=String(s??'').trim();if(!s)return null;
  const neg=/^\(.*\)$/.test(s)||/^-|-$/.test(s.replace(/[$€£\s]/g,''));
  let t=s.replace(/[^0-9.,]/g,'');if(!t)return null;
  if(/,\d{1,2}$/.test(t)&&!/\.\d{1,2}$/.test(t))t=t.replace(/\./g,'').replace(',','.');else t=t.replace(/,/g,'');
  const n=parseFloat(t);if(isNaN(n))return null;
  return Math.round(n*100)*(neg?-1:1);
}
const decode=s=>String(s||'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&#39;|&apos;/g,"'").replace(/&quot;/g,'"').replace(/\s+/g,' ').trim();
function findHeader(rows){
  for(let i=0;i<Math.min(rows.length-1,15);i++){const r=rows[i];const ne=r.filter(c=>c.trim()!=='');
    if(ne.length>=3&&!ne.some(c=>parseDate(c,'mdy')&&/\d{2,4}/.test(c)&&/^[\d\/\-. ]+$/.test(c.trim()))&&!ne.some(c=>/^[-($]*[\d,]+\.\d{2}\)?$/.test(c.trim())))return i;}
  return 0;
}
function guessRoles(headers){
  const map=headers.map(()=> 'ignore');const used={};
  const set=(i,r)=>{if(!used[r]){map[i]=r;used[r]=1;}};
  headers.forEach((h,i)=>{const l=h.toLowerCase().trim();
    if(/post/.test(l)&&/date/.test(l))set(i,'postDate');
    else if(/date/.test(l))set(i,'date');
    else if(/desc|payee|merchant|narrat|^name$/.test(l))set(i,'desc');
    else if(/^amount|amt/.test(l)&&!/balance/.test(l))set(i,'amount');
    else if(/balance/.test(l))set(i,'balance');
    else if(/categ/.test(l))set(i,'category');
    else if(/^type$|trans.*type|activity type/.test(l))set(i,'type');
    else if(/member|card ?holder/.test(l))set(i,'person');
    else if(/^symbol|ticker/.test(l))set(i,'symbol');
    else if(/quantity|shares/.test(l))set(i,'quantity');
    else if(/price/.test(l))set(i,'price');
    else if(/memo|note/.test(l))set(i,'memo');});
  if(!used.type)headers.forEach((h,i)=>{if(map[i]==='ignore'&&/^details$/i.test(h.trim()))set(i,'type');});
  if(!used.amount)headers.forEach((h,i)=>{const l=h.toLowerCase();if(map[i]!=='ignore')return;
    if(/debit|withdraw|money out|paid out/.test(l))set(i,'debit');else if(/credit|deposit|money in|paid in/.test(l))set(i,'credit');});
  if(used.postDate&&!used.date){map[map.indexOf('postDate')]='date';}
  return map;
}
function normalize(q){
  const col=r=>q.map.indexOf(r);const c={};for(const r of Object.keys(ROLES))c[r]=col(r);
  const dcol=c.postDate>=0?c.postDate:c.date;
  let fmt=q.fmt;if(fmt==='auto')fmt=dcol>=0?detectFmt(q.data.map(r=>r[dcol])):'mdy';
  const out=[];let bad=0;
  const dash=v=>v==='--'?'':v;
  for(const r of q.data){
    if(r.filter(c=>String(c).trim()!=='').length<3)continue;
    const date=dcol>=0?parseDate(r[dcol],fmt):null;
    const tdate=(c.postDate>=0&&c.date>=0)?parseDate(r[c.date],fmt):null;
    let amt=null;
    if(c.amount>=0)amt=parseAmt(r[c.amount]);
    else{const o=c.debit>=0?parseAmt(r[c.debit]):null,i=c.credit>=0?parseAmt(r[c.credit]):null;if(o!==null||i!==null)amt=Math.abs(i||0)-Math.abs(o||0);}
    if(!date||amt===null){bad++;continue;}
    if(q.sign==='flip')amt=-amt;
    let desc=c.desc>=0?decode(r[c.desc]):'';const memo=c.memo>=0?dash(decode(r[c.memo])):'';if(memo)desc=desc?desc+' / '+memo:memo;
    out.push({date,tdate,amt,desc,bal:c.balance>=0?parseAmt(r[c.balance]):null,cat:c.category>=0?dash(decode(r[c.category])):'',type:c.type>=0?decode(r[c.type]):'',who:c.person>=0?decode(r[c.person]):'',sym:c.symbol>=0?dash(decode(r[c.symbol])):'',qty:c.quantity>=0?decode(r[c.quantity]):''});
  }
  const ds=out.map(o=>o.date).sort();
  return {rows:out,bad,from:ds[0],to:ds[ds.length-1],desc:out.length>1&&out[0].date>out[out.length-1].date};
}

/* ---------- state ---------- */
const LS='networth-ledger.v1';
let S={accounts:[],txns:[],profiles:{},imports:[],carry:true,sample:false};
let ui={step:'welcome',tab:'overview',range:'all',view:'net',txAcct:'',txQ:'',txKind:'all',txLimit:150,queue:[],msg:'',confirm:''};
let D=null, downloads=null, storageOK=true;
function save(){if(S.sample)return;try{localStorage.setItem(LS,JSON.stringify(S));storageOK=true;}catch(e){storageOK=false;}}
function load(){try{const s=localStorage.getItem(LS);if(s){const o=JSON.parse(s);if(o&&Array.isArray(o.accounts)&&o.accounts.length){S=Object.assign(S,o,{sample:false});return true;}}}catch(e){storageOK=false;}return false;}
const acct=id=>S.accounts.find(a=>a.id===id);
const GROUPS={overview:['overview','review'],plan:['budget','bills','debt','goals'],rent:['rent'],transactions:['transactions'],accounts:['setup','accounts','import']};
const SUB={overview:'Summary',review:'Monthly review',budget:'Budget',bills:'Bills and cash',debt:'Debt plan',goals:'Goals',setup:'Guided setup',accounts:'Account list',import:'Import and backup'};
const groupOf=t=>Object.keys(GROUPS).find(g=>GROUPS[g].includes(t));
const STEPS=[['welcome','Start'],['debit','Bank accounts'],['credit','Credit cards'],['loans','Loans'],['invest','Investments'],['assets','Other assets'],['review','Review']];
const stepOf=a=>a.type==='checking'||a.type==='savings'?'debit':a.type==='credit'?'credit':a.type==='loan'?'loans':a.type==='brokerage'?'invest':'assets';
function goReal(){if(S.sample)S={accounts:[],txns:[],profiles:S.profiles||{},imports:[],carry:true,sample:false};}
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const tkey=t=>[t.date,t.tdate||'',t.amt,t.bal??'',t.desc.toUpperCase()].join('|');

function commitImport(q){
  const n=normalize(q);if(!n.rows.length)return {error:'No rows could be read. Check the date and amount columns.'};
  goReal();
  const hasBal=n.rows.some(r=>r.bal!==null);
  let a=q.acct!=='new'?acct(q.acct):null;
  if(!a){a={id:uid(),name:q.newName.trim()||q.file,type:q.newType,mode:hasBal?'column':'anchor',anchor:null,snaps:[]};S.accounts.push(a);}
  else if(hasBal&&a.mode==='anchor'&&!S.txns.some(t=>t.acct===a.id))a.mode='column';
  if(a.type==='brokerage')a.mode='manual';
  const av=parseAmt(q.anchorVal);
  if(a.type==='brokerage'&&av!==null){const d=q.anchorDate||n.to;a.snaps=a.snaps.filter(x=>x.date!==d);a.snaps.push({date:d,value:av});}
  if(a.mode==='anchor'&&av!==null)a.anchor={date:q.anchorDate||n.to,value:isLiab(a)?-Math.abs(av):av};
  const existing={};for(const t of S.txns)if(t.acct===a.id)existing[t.key]=(existing[t.key]||0)+1;
  const seen={};const impIdx=S.imports.length+1;let added=0,dupes=0;const N=n.rows.length;
  n.rows.forEach((r,i)=>{const key=tkey(r);seen[key]=(seen[key]||0)+1;
    if(seen[key]<=(existing[key]||0)){dupes++;return;}
    S.txns.push({id:uid(),acct:a.id,date:r.date,tdate:r.tdate,amt:r.amt,desc:r.desc,bal:r.bal,cat:r.cat,type:r.type,who:r.who||undefined,sym:r.sym||undefined,qty:r.qty||undefined,key,seq:impIdx*1e6+(n.desc?N-i:i),imp:impIdx});added++;});
  S.profiles[q.sig]={map:q.map.slice(),sign:q.sign,fmt:q.fmt,acct:a.id};
  S.imports.push({n:impIdx,file:q.file,acct:a.id,when:new Date().toISOString().slice(0,10),added,dupes,bad:n.bad,from:n.from,to:n.to});
  save();return {added,dupes,bad:n.bad,name:a.name};
}

/* ---------- derived: transfers, duplicates, balances, net worth ---------- */
function recompute(){
  S.budget=S.budget||{};S.goals=S.goals||[];S.rules=S.rules||{};S.debt=S.debt||{budget:0,strategy:'avalanche'};S.bills=S.bills||[];S.billOff=S.billOff||{};S.billDay=S.billDay||{};S.props=S.props||[];S.review=S.review||{};
  const A={};for(const a of S.accounts)A[a.id]={a,tx:[],pts:[],recon:null,needsAnchor:false};
  for(const t of S.txns)if(A[t.acct])A[t.acct].tx.push(t);
  for(const id in A)A[id].tx.sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:x.seq-y.seq);

  // transfers between accounts
  const X={};const strong=t=>{const a=A[t.acct].a;return /transfer|xfer/i.test(t.desc+' '+t.type)||(isLiab(a)&&t.amt>0&&/payment|autopay|pymt/i.test(t.desc+' '+t.type));};
  const buckets={};for(const t of S.txns){if(t.ex||t.xo==='no'||!t.amt||!A[t.acct])continue;(buckets[Math.abs(t.amt)]=buckets[Math.abs(t.amt)]||[]).push(t);}
  for(const k in buckets){const b=buckets[k];if(b.length<2)continue;const neg=b.filter(t=>t.amt<0),pos=b.filter(t=>t.amt>0);if(!neg.length||!pos.length)continue;
    const cand=[];for(const n of neg)for(const p of pos){if(n.acct===p.acct)continue;const dd=Math.abs(dayNum(n.date)-dayNum(p.date));if(dd>4)continue;
      const ok=strong(n)||strong(p)||(isLiab(A[p.acct].a)&&!isLiab(A[n.acct].a)&&/pay|pmt|card|crd/i.test(n.desc));if(ok)cand.push([dd,n,p]);}
    cand.sort((x,y)=>x[0]-y[0]);for(const [,n,p] of cand){if(X[n.id]||X[p.id])continue;X[n.id]={k:'pair',o:p.id};X[p.id]={k:'pair',o:n.id};}}
  const refs={};
  for(const t of S.txns){if(t.ex||t.xo==='no'||X[t.id]||!A[t.acct])continue;if(strong(t)){X[t.id]={k:'solo'};
    const m=t.desc.match(/\b([A-Z]{3})\s*\.{2,}\s*(\d{4})/);if(m&&!S.accounts.some(a=>a.name.includes(m[2])||a.last4===m[2]))refs[m[1]+' ...'+m[2]]=(refs[m[1]+' ...'+m[2]]||0)+1;}}
  const isX=t=>t.xo==='yes'||(t.xo!=='no'&&!!X[t.id]);

  // possible duplicates inside one account (only where there is no running balance to verify them)
  const dup={};
  for(const id in A){if(A[id].a.mode==='column')continue;const g={};for(const t of A[id].tx){if(t.ex)continue;const k=t.date+'|'+t.amt+'|'+t.desc.toUpperCase();(g[k]=g[k]||[]).push(t);}
    for(const k in g)if(g[k].length>1&&!g[k].every(t=>t.dk))for(const t of g[k])if(!t.dk)dup[t.id]=1;}

  // balance points per account: [dayNum, value] at close of day, value signed for net worth
  for(const id in A){const o=A[id],a=o.a,sg=isLiab(a)?-1:1;const pts=[];
    if(a.mode==='manual'){const sn=[...a.snaps].sort((x,y)=>x.date<y.date?-1:1);for(const s of sn)pts.push([dayNum(s.date),s.value]);
      const l=a.loan,pay=l&&(l.pi||l.pay),rate=l?parseFloat(l.rate):NaN;
      if(a.type==='loan'&&sn.length&&pay>0&&rate>=0&&!a.noProj){const ls=sn[sn.length-1];let bal=-ls.value;const end=dayNum(today()),y0=+ls.date.slice(0,4),m0=+ls.date.slice(5,7)-1,dd=+ls.date.slice(8);
        for(let k=1;k<720&&bal>0;k++){const yy=y0+Math.floor((m0+k)/12),mm=(m0+k)%12,dn=Math.round(Date.UTC(yy,mm,Math.min(dd,new Date(Date.UTC(yy,mm+1,0)).getUTCDate()))/864e5);if(dn>end)break;
          bal=Math.max(0,Math.round(bal*(1+rate/1200))-pay);pts.push([dn,-bal]);o.projected=ls.date;}}}
    else if(a.mode==='column'){const tx=o.tx.filter(t=>t.bal!==null);let breaks=[];
      if(tx.length){pts.push([dayNum(tx[0].date)-1,sg*(tx[0].bal-tx[0].amt)]);
        for(let i=0;i<tx.length;i++){const t=tx[i],d=dayNum(t.date);if(i&&tx[i-1].bal+t.amt!==t.bal)breaks.push({from:tx[i-1].date,to:t.date,diff:t.bal-tx[i-1].bal-t.amt});
          if(pts[pts.length-1][0]===d)pts[pts.length-1][1]=sg*t.bal;else pts.push([d,sg*t.bal]);}}
      o.recon={rows:tx.length,breaks};}
    else{const tx=o.tx.filter(t=>!t.ex);if(tx.length){
        let an=a.anchor;if(!an){o.needsAnchor=true;an={date:tx[tx.length-1].date,value:0};}
        const ad=dayNum(an.date);let after=0;for(const t of tx)if(dayNum(t.date)>ad)after+=t.amt;
        const total=tx.reduce((s,t)=>s+t.amt,0);let v=an.value+after-total; // opening value before first row
        pts.push([dayNum(tx[0].date)-1,v]);
        for(const t of tx){const d=dayNum(t.date);v+=t.amt;if(pts[pts.length-1][0]===d)pts[pts.length-1][1]=v;else pts.push([d,v]);}
        if(ad>pts[pts.length-1][0])pts.push([ad,an.value]);}
      else if(a.anchor)pts.push([dayNum(a.anchor.date),a.anchor.value]);}
    o.pts=pts;o.current=pts.length?pts[pts.length-1][1]:0;o.first=pts.length?pts[0][0]:null;o.last=pts.length?pts[pts.length-1][0]:null;}

  // net worth by day
  const ids=Object.keys(A).filter(id=>A[id].pts.length);let nw=null;
  if(ids.length){const d0=Math.min(...ids.map(id=>A[id].first)),d1=Math.max(...ids.map(id=>A[id].last));
    const days=[],total=[],assets=[],liabs=[],per={};const ptr={};ids.forEach(id=>{per[id]=[];ptr[id]=-1;});
    for(let d=d0;d<=d1;d++){let s=0,as=0,li=0;for(const id of ids){const p=A[id].pts;while(ptr[id]+1<p.length&&p[ptr[id]+1][0]<=d)ptr[id]++;
        const v=ptr[id]>=0?p[ptr[id]][1]:(S.carry?p[0][1]:0);per[id].push(v);s+=v;if(v>=0)as+=v;else li+=v;}
      days.push(d);total.push(s);assets.push(as);liabs.push(li);}
    nw={days,total,assets,liabs,per,ids};}

  // categorized money in and out by month, transfers left out
  const cash={},months={},flow=[];
  for(const t of S.txns){const o=A[t.acct];if(!o||t.ex||isX(t)||!t.amt)continue;const a=o.a;
    if(a.type==='brokerage'&&!/dividend|interest/i.test((t.type||'')+' '+t.desc))continue;
    const cat=catOf(t,a),m=t.date.slice(0,7),M=months[m]=months[m]||{inc:0,out:0,cats:{}};let inc=0,out=0;
    if(cat==='Income')inc=t.amt;else out=-t.amt;const prop=propOf(t,a);if(!(prop&&S.noRentalBudget)){M.inc+=inc;M.out+=out;if(out)M.cats[cat]=(M.cats[cat]||0)+out;}flow.push({t,cat,inc,out,prop,bank:!isLiab(a)});}
  for(const m in months)cash[m]={inc:Math.max(0,months[m].inc),out:Math.max(0,months[m].out)};
  D={A,X,isX,dup,nw,cash,refs,months,flow};D.flags=flagged();
}

/* ---------- charts ---------- */
function niceTicks(lo,hi,n){if(lo===hi){hi=lo+100;}const raw=(hi-lo)/n,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;const step=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;
  const a=Math.floor(lo/step)*step,b=Math.ceil(hi/step)*step;const t=[];for(let v=a;v<=b+step/2;v+=step)t.push(Math.round(v));return t;}
function monthTicks(d0,d1,max){const all=[];const dt=new Date(d0*864e5);let y=dt.getUTCFullYear(),m=dt.getUTCMonth();if(dt.getUTCDate()>1)m++;if(m>11){m=0;y++;}
  for(;;){const n=Math.round(Date.UTC(y,m,1)/864e5);if(n>d1)break;all.push([n,y,m]);m++;if(m>11){m=0;y++;}}
  if(all.length>30){const jan=all.filter(a=>a[2]===0),step=Math.max(1,Math.ceil(jan.length/max));return jan.filter((_,i)=>i%step===0).map(a=>[a[0],String(a[1])]);}
  const step=Math.max(1,Math.ceil(all.length/max));return all.filter((_,i)=>i%step===0).map((a,i)=>[a[0],MON[a[2]]+(a[2]===0||i===0?" '"+String(a[1]).slice(2):'')]);}
function lineChart(host,days,series,label){
  label=label||(d=>fmtDate(isoOf(d)));
  const W=Math.max(300,host.clientWidth),H=Math.round(Math.min(340,Math.max(220,W*0.36))),L=58,R=14,T=12,B=26;
  let lo=Infinity,hi=-Infinity;for(const s of series)for(const v of s.vals){if(v<lo)lo=v;if(v>hi)hi=v;}
  if(lo>0&&lo<(hi-lo)*1.5)lo=0;if(hi<0&&-hi<(hi-lo)*1.5)hi=0;
  const ticks=niceTicks(lo,hi,5);lo=ticks[0];hi=ticks[ticks.length-1];
  const n=days.length,d0=days[0],d1=days[n-1],xd=d=>L+(d1>d0?(d-d0)/(d1-d0):.5)*(W-L-R),x=i=>xd(days[i]),y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  let g='';for(const t of ticks)g+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(${t===0?'--axis':'--line'})" stroke-width="1"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end">${compact(t)}</text>`;
  for(const [dn,lab] of monthTicks(d0,d1,W<520?4:8)){const xi=xd(dn);g+=`<line x1="${xi}" x2="${xi}" y1="${H-B}" y2="${H-B+4}" stroke="var(--axis)"/><text x="${xi}" y="${H-8}" text-anchor="middle">${lab}</text>`;}
  let paths='';
  series.forEach(s=>{let d='';for(let i=0;i<n;i++)d+=(i?'L':'M')+x(i).toFixed(1)+' '+y(s.vals[i]).toFixed(1);
    if(series.length===1){const base=y(Math.max(lo,Math.min(hi,0)));paths+=`<path d="${d}L${x(n-1).toFixed(1)} ${base}L${x(0).toFixed(1)} ${base}Z" fill="var(${s.color})" fill-opacity=".10" stroke="none"/>`;}
    paths+=`<path d="${d}" fill="none" stroke="var(${s.color})" stroke-width="2" stroke-linejoin="round"/><circle cx="${x(n-1)}" cy="${y(s.vals[n-1])}" r="3.5" fill="var(${s.color})" stroke="var(--surface)" stroke-width="2"/>`;});
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Balance over time">${g}${paths}<line id="cx" y1="${T}" y2="${H-B}" stroke="var(--ink2)" stroke-width="1" visibility="hidden"/><g id="cd"></g><rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent" id="hit"/></svg><div class="tip" hidden></div>`;
  const svg=host.querySelector('svg'),tip=host.querySelector('.tip'),cx=host.querySelector('#cx'),cd=host.querySelector('#cd');
  const move=e=>{const r=svg.getBoundingClientRect();const px=((e.touches?e.touches[0].clientX:e.clientX)-r.left)*W/r.width;
    const day=d0+(px-L)/(W-L-R)*(d1-d0);let a=0,b=n-1;while(b-a>1){const mid=(a+b)>>1;if(days[mid]<day)a=mid;else b=mid;}const i=Math.abs(days[a]-day)<=Math.abs(days[b]-day)?a:b;
    cx.setAttribute('x1',x(i));cx.setAttribute('x2',x(i));cx.setAttribute('visibility','visible');
    cd.innerHTML=series.map(s=>`<circle cx="${x(i)}" cy="${y(s.vals[i])}" r="4" fill="var(${s.color})" stroke="var(--surface)" stroke-width="2"/>`).join('');
    tip.innerHTML=`<div class="t">${label(days[i])}</div>`+series.map(s=>`<div class="l"><span><span class="sw" style="background:var(${s.color})"></span>${esc(s.name)}</span><span>${money(s.vals[i])}</span></div>`).join('');
    tip.hidden=false;const tx=x(i)*r.width/W;tip.style.left=Math.max(0,Math.min(r.width-tip.offsetWidth,tx>r.width/2?tx-tip.offsetWidth-12:tx+12))+'px';tip.style.top='8px';};
  const leave=()=>{tip.hidden=true;cx.setAttribute('visibility','hidden');cd.innerHTML='';};
  svg.addEventListener('mousemove',move);svg.addEventListener('touchstart',move,{passive:true});svg.addEventListener('touchmove',move,{passive:true});svg.addEventListener('mouseleave',leave);
}
function barChart(host,months,data){
  const W=Math.max(300,host.clientWidth),H=220,L=58,R=14,T=12,B=26;const hi0=Math.max(1,...data.map(d=>Math.max(d.inc,d.out)));
  const ticks=niceTicks(0,hi0,4),hi=ticks[ticks.length-1];const y=v=>T+(1-v/hi)*(H-T-B);const n=months.length,slot=(W-L-R)/n,bw=Math.max(2,Math.min(18,(slot-6)/2));
  let g='';for(const t of ticks)g+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(${t===0?'--axis':'--line'})"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end">${compact(t)}</text>`;
  const bar=(x,v,c)=>{const h=y(0)-y(v);if(h<=0)return '';const r=Math.min(3,bw/2,h);return `<path d="M${x} ${y(0)}V${y(v)+r}q0 ${-r} ${r} ${-r}h${bw-2*r}q${r} 0 ${r} ${r}V${y(0)}Z" fill="var(${c})"/>`;};
  const lstep=Math.max(1,Math.ceil(n/(W<520?4:8)));
  months.forEach((m,i)=>{const c=L+slot*i+slot/2;g+=bar(c-bw-1,data[i].inc,'--s1')+bar(c+1,data[i].out,'--s2');
    if(i%lstep===0)g+=`<text x="${c}" y="${H-8}" text-anchor="middle">${MON[+m.slice(5)-1]}${+m.slice(5)===1||i===0?" '"+m.slice(2,4):''}</text>`;
    g+=`<rect data-i="${i}" x="${L+slot*i}" y="${T}" width="${slot}" height="${H-T-B}" fill="transparent"/>`;});
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly money in and out">${g}</svg><div class="tip" hidden></div>`;
  const svg=host.querySelector('svg'),tip=host.querySelector('.tip');
  svg.addEventListener('mousemove',e=>{const i=e.target.dataset&&e.target.dataset.i;if(i==null){tip.hidden=true;return;}const d=data[i],m=months[i];
    tip.innerHTML=`<div class="t">${MON[+m.slice(5)-1]} ${m.slice(0,4)}</div><div class="l"><span><span class="sw" style="background:var(--s1)"></span>Money in</span><span>${money(d.inc)}</span></div><div class="l"><span><span class="sw" style="background:var(--s2)"></span>Money out</span><span>${money(d.out)}</span></div><div class="l"><span>Net</span><span>${money(d.inc-d.out,true)}</span></div>`;
    tip.hidden=false;const r=svg.getBoundingClientRect(),tx=(L+slot*i+slot/2)*r.width/W;tip.style.left=Math.max(0,Math.min(r.width-tip.offsetWidth,tx>r.width/2?tx-tip.offsetWidth-12:tx+12))+'px';tip.style.top='8px';});
  svg.addEventListener('mouseleave',()=>tip.hidden=true);
}

/* ---------- views ---------- */
function rangeSlice(){const nw=D.nw;const n=nw.days.length;const end=nw.days[n-1];let start=nw.days[0];
  const r=ui.range;if(r==='3m')start=end-91;else if(r==='6m')start=end-182;else if(r==='1y')start=end-365;else if(r==='ytd')start=dayNum(isoOf(end).slice(0,4)+'-01-01');
  return Math.max(0,start-nw.days[0]);}
function warnings(){const w=[];
  for(const id in D.A){const o=D.A[id];
    if(o.needsAnchor)w.push(`<b>${esc(o.a.name)}</b> has no balance column, so its balance is unknown. Until you enter a statement balance it is treated as $0.00 on its last transaction date. <button class="link" data-act="tab" data-tab="accounts">Enter balance</button>`);
    if(o.recon&&o.recon.breaks.length){const b=o.recon.breaks[0];w.push(`<b>${esc(o.a.name)}</b>: the running balance does not follow from the transactions in ${o.recon.breaks.length} place${o.recon.breaks.length>1?'s':''}. First gap between ${fmtDate(b.from)} and ${fmtDate(b.to)} (${money(b.diff,true)} unexplained). A statement period is probably missing.`);}}
  const refs=Object.keys(D.refs);if(refs.length)w.push(`Transfers mention accounts that are not imported: <b>${refs.map(esc).join(', ')}</b>. Net worth leaves out their balances until you import them.`);
  const nd=Object.keys(D.dup).length;if(nd)w.push(`${nd} transactions look like repeats within one account (same day, amount and description). They are counted until you review them. <button class="link" data-act="showdups">Review</button>`);
  return w;}
function vOverview(){
  if(!D.nw)return `<div class="panel"><h2>No balances yet</h2><div class="small">Net worth, assets, liabilities and the timeline appear here once an account has a file or a value.</div><div><button class="btn primary" data-act="tab" data-tab="setup">Go to setup</button></div></div>`;
  const nw=D.nw,n=nw.days.length,i0=rangeSlice();const cur=nw.total[n-1],chg=cur-nw.total[i0];

  const seg=(key,val,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button data-act="set" data-k="${key}" data-v="${v}" aria-pressed="${val===v}">${l}</button>`).join('')}</div>`;
  const rows=S.accounts.map((a,k)=>{const o=D.A[a.id];const src=a.mode==='column'?'Balance column':a.mode==='manual'?'Entered by hand':!o.tx.length&&!a.anchor?'<span class="pill w">No file yet</span>':o.needsAnchor?'<span class="pill w">Balance needed</span>':'Statement balance + transactions';
    return `<tr><td>${ui.view==='acct'&&k<8&&o.pts.length?`<span class="sw" style="background:var(${SERIES[k]})"></span>`:''}${esc(a.name)}</td><td>${TYPES[a.type]}</td><td>${src}</td><td>${o.last!=null?fmtDate(isoOf(o.last)):''}</td><td class="num ${o.current<0?'neg':''}">${money(o.current)}</td></tr>`;}).join('');
  const months=Object.keys(D.cash).sort().slice(-24);
  return `${w.length?`<details class="note" ${w.length<=2?'open':''}><summary><b>${w.length} thing${w.length>1?'s':''} to check before trusting the totals</b></summary><ul>${w.map(x=>`<li>${x}</li>`).join('')}</ul></details>`:''}
  <div class="figs">
    <div class="fig main"><div class="k">Net worth</div><div class="v ${cur<0?'neg':''}">${money(cur)}</div><div class="d"><span class="${chg<0?'neg':'pos'}">${money(chg,true)}</span> since ${fmtDate(isoOf(nw.days[i0]))}</div></div>
    <div class="fig"><div class="k">Assets</div><div class="v">${money(nw.assets[n-1])}</div><div class="d">${plural(S.accounts.filter(a=>D.A[a.id].current>=0).length)}</div></div>
    <div class="fig"><div class="k">Liabilities</div><div class="v">${money(-nw.liabs[n-1])}</div><div class="d">${plural(S.accounts.filter(a=>D.A[a.id].current<0).length)}</div></div>

const nice=d=>{const m=String(d).match(/ORIG CO NAME:(.+?)\s+ORIG ID.*?CO ENTRY DESCR:\s*(\S+)/);return m?`${m[1].trim()} ${m[2]}`:d;};

function catOf(t,a){const r=S.rules[mkey(t.desc)];if(r)return r;const f=FILECAT[(t.cat||'').toLowerCase()];if(f)return f;if(t.cat&&CATS.includes(t.cat))return t.cat;

function monthStats(){const ms=Object.keys(D.months).sort();const cur=ms[ms.length-1];const prev=ms.slice(0,-1).slice(-3);const base=prev.length?prev:ms.slice(-1);

function recurring(){const g={};let lastAll='';for(const f of D.flow){if(f.t.date>lastAll)lastAll=f.t.date;if(f.out<=0)continue;const k=mkey(f.t.desc);(g[k]=g[k]||[]).push(f);}
  const out=[];for(const k in g){const a=g[k];if(new Set(a.map(f=>f.t.date.slice(0,7))).size<3)continue;
    const amts=a.map(f=>f.out).sort((x,y)=>x-y),med=amts[amts.length>>1];const close=a.filter(f=>Math.abs(f.out-med)<=med*0.1),cm=new Set(close.map(f=>f.t.date.slice(0,7)));

function debtList(){return S.accounts.filter(a=>isLiab(a)&&-D.A[a.id].current>0).map(a=>{const bal=-D.A[a.id].current,apr=parseFloat(a.apr)||parseFloat((a.loan||{}).rate)||0;
  const est=!a.minPay&&!(a.loan&&a.loan.pay);const min=a.minPay||(a.loan&&a.loan.pay)||Math.max(4000,Math.round(bal*0.01+bal*apr/1200));

function simulate(debts,budget,order){
  const d=debts.map(x=>({id:x.id,bal:x.bal,apr:x.apr,min:x.min}));let interest=0,first=null;const series=[d.reduce((s,x)=>s+x.bal,0)];
  const pri=order==='snowball'?(a,b)=>a.bal-b.bal:(a,b)=>b.apr-a.apr||a.bal-b.bal;
  for(let m=0;m<720;m++){if(d.every(x=>x.bal<=0))return {months:m,interest,series,first:first||{}};
    const pay={};let avail=order==='min'?d.reduce((s,x)=>s+(x.bal>0?x.min:0),0):budget;
    for(const x of d)if(x.bal>0){const i=Math.round(x.bal*x.apr/1200);x.bal+=i;interest+=i;}
    for(const x of d)if(x.bal>0){const p=Math.max(0,Math.min(x.bal,x.min,avail));x.bal-=p;avail-=p;pay[x.id]=p;}
    if(order!=='min')for(const x of d.filter(x=>x.bal>0).sort(pri)){const p=Math.min(x.bal,avail);x.bal-=p;avail-=p;pay[x.id]=(pay[x.id]||0)+p;if(avail<=0)break;}
    if(!first)first=pay;series.push(d.reduce((s,x)=>s+x.bal,0));}
  return {months:null,interest,series,first:first||{}};}
const monthsFrom=n=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+n);return `${MON[d.getMonth()]} ${d.getFullYear()}`;};

    <tr><td></td><td><b>In plan</b></td><td class="num"><b>${money(inc.reduce((s,x)=>s+x.bal,0))}</b></td><td></td><td class="num"><b>${money(mins)}</b></td><td></td><td class="num"><b>${money(inc.reduce((s,x)=>s+Math.round(x.bal*x.apr/1200),0))}</b></td><td></td></tr></tbody></table></div>

    <div class="small" style="align-self:flex-end">${list.length} transactions, net ${money(total,true)}. Changing a category applies to every transaction from the same payee.</div></div>
    <div class="scroll"><table><thead><tr><th>Date</th><th>Account</th><th>Description</th><th>Category</th>${S.props.length?'<th>Rental</th>':''}<th class="num">Amount</th><th class="num">Balance</th><th>Status</th></tr></thead><tbody>${rows||'<tr><td colspan="8" class="small">Nothing matches.</td></tr>'}</tbody></table></div>
    ${list.length>ui.txLimit?`<div><button class="btn" data-act="more">Show ${Math.min(300,list.length-ui.txLimit)} more</button></div>`:''}</div>`;
}
function render(){
  recompute();
  const grp=groupOf(ui.tab);ui.last=ui.last||{};ui.last[grp]=ui.tab;
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.g===grp));
  $('#subnav').innerHTML=GROUPS[grp].length>1?`<div class="seg sub">${GROUPS[grp].map(t=>`<button data-tab="${t}" aria-pressed="${t===ui.tab}">${SUB[t]}</button>`).join('')}</div>`:'';
  $('#asof').textContent=D.nw?`${S.accounts.length} accounts, ${S.txns.length} transactions, through ${fmtDate(isoOf(D.nw.days[D.nw.days.length-1]))}`:'';
  $('#view').innerHTML=ui.tab==='setup'?vSetup():ui.tab==='budget'?vBudget():ui.tab==='debt'?vDebt():ui.tab==='goals'?vGoals():ui.tab==='review'?vReview():ui.tab==='bills'?vBills():ui.tab==='rent'?vRent():ui.tab==='overview'?vOverview():ui.tab==='import'?vImport():ui.tab==='accounts'?vAccounts():vTx();
  if(ui.tab==='overview')drawCharts();
  if(ui.tab==='debt')drawDebt();
  if(ui.tab==='bills')drawBills();
  if(ui.tab==='budget')drawTrend();
}

/* ---------- actions ---------- */
function addFiles(files,target){
  let pending=files.length;if(!pending)return;ui.msg='';
  for(const f of files){const rd=new FileReader();rd.onload=()=>{try{
      const rows=parseCSV(String(rd.result));const hi=findHeader(rows);const headers=(rows[hi]||[]).map(h=>h.trim());const data=rows.slice(hi+1);
      if(headers.length<2||!data.length)throw 0;
      const sig=headers.join('|').toLowerCase();const p=S.profiles[sig];
      const map=p&&p.map.length===headers.length?p.map.slice():guessRoles(headers);
      const m=f.name.replace(/\.[^.]+$/,'').match(/^([A-Za-z]+)[\s_-]*(\d{4})(?!\d)/);const name=m?`${m[1]} ${m[2]}`:f.name.replace(/\.[^.]+$/,'');
      const hl=sig;const type=/symbol|quantity|shares|ticker/.test(hl)?'brokerage':/member name|card ?holder/.test(hl)?'credit':(map.includes('category')&&!map.includes('balance'))?'credit':'checking';
      const ta=target&&acct(target);const q={id:uid(),file:f.name,headers,data,sig,map,sign:p?p.sign:'asis',fmt:p?p.fmt:'auto',acct:'new',newName:name,newType:ta?ta.type:type,anchorVal:'',anchorDate:'',remembered:!!p};
      const same=!S.sample&&S.accounts.find(a=>a.name===name||(m&&a.last4===m[2]));if(ta)q.acct=ta.id;else if(same)q.acct=same.id;else if(p&&!S.sample&&acct(p.acct)&&!m)q.acct=p.acct;
      if(!p&&q.newType==='credit'){const ai=map.indexOf('amount');if(ai>=0){let pos=0,neg=0;for(const r of data){const v=parseAmt(r[ai]);if(v>0)pos++;else if(v<0)neg++;}if(pos>neg)q.sign='flip';}}
      ui.queue.push(q);
    }catch(e){ui.msg=`${esc(f.name)} could not be read as a table. Export it again as CSV.`;}
    if(--pending===0)render();};rd.readAsText(f);}
}
const Q=id=>ui.queue.find(q=>q.id===id);
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act],[data-tab]');if(!b)return;const act=b.dataset.act||'tab',id=b.dataset.id;
  if(act!=='wipe'&&act!=='adel'&&act!=='pdel')ui.confirm='';
  if(act==='grp'){const g=b.dataset.g;ui.tab=(ui.last&&ui.last[g])||(g==='accounts'?(S.setupDone?'accounts':'setup'):GROUPS[g][0]);try{history.replaceState(null,'','#'+ui.tab);}catch(_){}}
  else if(act==='tab'){ui.tab=b.dataset.tab;try{history.replaceState(null,'','#'+ui.tab);}catch(_){}}
  else if(act==='set'){ui[b.dataset.k]=b.dataset.v;}
  else if(act==='step'){ui.tab='setup';ui.step=b.dataset.v;ui.msg='';window.scrollTo(0,0);}
  else if(act==='finish'){S.setupDone=true;save();ui.tab='overview';}
  else if(act==='sadd'){const inst=$('#s-inst').value.trim(),l4=$('#s-last4').value.replace(/\D/g,'').slice(-4),nm=$('#s-name').value.trim()||[inst,l4].filter(Boolean).join(' ');if(!nm){ui.msg='Enter the bank or a name for the account.';}else{goReal();ui.msg='';
    const type=$('#s-type').value;S.accounts.push({id:uid(),name:nm,inst,last4:l4,type,mode:'anchor',anchor:null,snaps:[]});save();}}
  else if(act==='ladd'){const nm=$('#l-name').value.trim(),v=parseAmt($('#l-owed').value);if(!nm||v===null){ui.msg='Enter a name and the amount owed.';}else{goReal();ui.msg='';
    S.accounts.push({id:uid(),name:nm,inst:$('#l-lender').value.trim(),kind:$('#l-kind').value,type:'loan',mode:'manual',anchor:null,snaps:[{date:$('#l-date').value||today(),value:-Math.abs(v)}],loan:{rate:$('#l-rate').value.replace(/[^0-9.]/g,''),pay:Math.abs(parseAmt($('#l-pay').value)||0),pi:Math.abs(parseAmt($('#l-pi').value)||0),end:$('#l-end').value}});save();}}
  else if(act==='xadd'){const nm=$('#x-name').value.trim(),v=parseAmt($('#x-val').value),k=$('#x-kind').value;if(!nm||v===null){ui.msg='Enter a name and a value.';}else{goReal();ui.msg='';
    S.accounts.push({id:uid(),name:nm,kind:k,src:$('#x-src').value.trim(),type:(ASSETK.find(x=>x[0]===k)||[0,'other'])[1],mode:'manual',anchor:null,snaps:[{date:$('#x-date').value||today(),value:v}]});save();}}
  else if(act==='addref'){const r=b.dataset.v,l4=r.slice(-4);S.accounts.push({id:uid(),name:'Account ending '+l4,inst:'',last4:l4,type:/^(MMA|SAV)/.test(r)?'savings':'checking',mode:'anchor',anchor:null,snaps:[]});save();ui.step='debit';}
  else if(act==='txgo'){ui.tab='transactions';ui.txQ=b.dataset.q||'';ui.txKind=b.dataset.kind||'all';ui.txAcct='';}
  else if(act==='showdups'){ui.tab='transactions';ui.txKind='dup';ui.txAcct='';ui.txQ='';}
  else if(act==='qdrop'){ui.queue=ui.queue.filter(q=>q.id!==id);}
  else if(act==='qgo'){const q=Q(id);const r=commitImport(q);if(r.error)ui.msg=r.error;else{ui.queue=ui.queue.filter(x=>x.id!==id);ui.msg=`<b>${esc(r.name)}</b>: added ${r.added} transactions${r.dupes?`, skipped ${r.dupes} that were already imported`:''}${r.bad?`, ${r.bad} rows had no date or amount`:''}.`;}}
  else if(act==='anchor'){const a=acct(id),v=parseAmt($('#anv-'+id).value),d=$('#and-'+id).value;if(v!==null&&d){a.anchor={date:d,value:isLiab(a)?-Math.abs(v):v};save();}}
  else if(act==='snapadd'){const a=acct(id),v=parseAmt($('#snv-'+id).value),d=$('#snd-'+id).value;if(v!==null&&d){if(a.mode!=='manual'&&!S.txns.some(t=>t.acct===id))a.mode='manual';a.snaps=a.snaps.filter(s=>s.date!==d);a.snaps.push({date:d,value:isLiab(a)?-Math.abs(v):v});save();}}
  else if(act==='snapdel'){const a=acct(id);a.snaps=a.snaps.filter(s=>s.date!==b.dataset.d);save();}
  else if(act==='madd'){const v=parseAmt($('#mv').value),d=$('#md').value||new Date().toISOString().slice(0,10),name=$('#mn').value.trim(),type=$('#mt').value;if(v===null||!name)return;
    goReal();
    const liab=type==='credit'||type==='loan';S.accounts.push({id:uid(),name,type,mode:'manual',anchor:null,snaps:[{date:d,value:liab?-Math.abs(v):v}]});save();}
  else if(act==='adel'){if(ui.confirm!=='adel'+id){ui.confirm='adel'+id;}else{S.accounts=S.accounts.filter(a=>a.id!==id);S.txns=S.txns.filter(t=>t.acct!==id);ui.confirm='';save();}}
  else if(act==='tx'){const t=S.txns.find(t=>t.id===id),f=b.dataset.f;if(f==='keep')t.dk=1;else if(f==='remove')t.ex=1;else if(f==='restore'){delete t.ex;t.dk=1;}else if(f==='notx')t.xo='no';else if(f==='fok')t.fk=1;else if(f==='isx')t.xo='yes';save();}
  else if(act==='more'){ui.txLimit+=300;}
  else if(act==='bavg'){const st=monthStats();for(const c of CATS){if(c==='Income')continue;const v=st.avgCat(c);if(v>0)S.budget[c]=Math.round(v/100)*100;}save();}
  else if(act==='dstrat'){S.debt.strategy=b.dataset.v;save();}
  else if(act==='gadd'){const nm=$('#g-name').value.trim(),tg=parseAmt($('#g-target').value);if(nm&&tg>0){S.goals.push({id:uid(),name:nm,target:tg,date:$('#g-date').value,acct:$('#g-acct').value,saved:0,monthly:Math.abs(parseAmt($('#g-monthly').value)||0)});save();}}
  else if(act==='gef'){const st=monthStats(),n=+b.dataset.n;S.goals.push({id:uid(),name:`Emergency fund, ${n} months`,target:st.avgOut*n,date:'',acct:'',saved:0,monthly:0});save();}
  else if(act==='gdel'){S.goals=S.goals.filter(g=>g.id!==id);save();}
  else if(act==='biladd'){const nm=$('#bl-name').value.trim(),v=parseAmt($('#bl-amt').value),day=Math.min(31,Math.max(1,parseInt($('#bl-day').value)||1));if(nm&&v){S.bills.push({id:uid(),name:nm,amt:Math.abs(v),day,dir:$('#bl-dir').value});save();}}
  else if(act==='bildel'){S.bills=S.bills.filter(x=>x.id!==id);save();}
  else if(act==='padd'){const nm=$('#p-name').value.trim();if(nm){S.props.push({id:uid(),name:nm});save();}}
  else if(act==='pdel'){if(ui.confirm!=='pdel'+id){ui.confirm='pdel'+id;}else{S.props=S.props.filter(x=>x.id!==id);for(const a of S.accounts)if(a.prop===id)delete a.prop;for(const t of S.txns)if(t.prop===id)delete t.prop;ui.confirm='';save();}}
  else if(act==='rcsv'){const pid=S.props.some(x=>x.id===ui.rprop)?ui.rprop:S.props[0].id,P=S.props.find(x=>x.id===pid);const ys=[...new Set(D.flow.filter(f=>f.prop===pid).map(f=>f.t.date.slice(0,4)))].sort().reverse(),yr=ys.includes(ui.ryear)?ui.ryear:ys[0];
    const rows=[['Date','Property','Schedule E line','Account','Description','Amount']];for(const f of rentRows(pid,yr).sort((a,b)=>a.t.date<b.t.date?-1:1))rows.push([f.t.date,P.name,taxOf(f),acct(f.t.acct).name,nice(f.t.desc),((f.inc-f.out)/100).toFixed(2)]);
    saveFile(`rental-${yr}.csv`,rows.map(r=>r.map(c=>/[",\n]/.test(c)?'"'+String(c).replace(/"/g,'""')+'"':c).join(',')).join('\n'));return;}
  else if(act==='forget'){S.profiles={};save();}
  else if(act==='wipe'){if(ui.confirm!=='wipe')ui.confirm='wipe';else{try{localStorage.removeItem(LS);}catch(_){}S={accounts:[],txns:[],profiles:{},imports:[],carry:true,sample:false};ui.confirm='';ui.queue=[];ui.tab='setup';ui.step='welcome';}}
  else if(act==='backup'){saveFile('net-worth-ledger-backup.json',JSON.stringify(S));return;}
  else if(act==='csv'){const rows=[['Date','Transaction date','Account','Account type','Description','Category','Type','Amount','Balance','Transfer','Removed']];
    for(const t of [...S.txns].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.seq-b.seq)){const a=acct(t.acct);if(!a)continue;rows.push([t.date,t.tdate||'',a.name,TYPES[a.type],t.desc,catOf(t,a),t.type,(t.amt/100).toFixed(2),t.bal!=null?(t.bal/100).toFixed(2):'',D.isX(t)?'yes':'',t.ex?'yes':'']);}
    saveFile('combined-transactions.csv',rows.map(r=>r.map(c=>/[",\n]/.test(c)?'"'+String(c).replace(/"/g,'""')+'"':c).join(',')).join('\n'));return;}
  else return;
  render();
});
document.addEventListener('change',e=>{
  const t=e.target,act=t.dataset.act,id=t.dataset.id;
  if(t.id==='file'){addFiles([...t.files]);t.value='';return;}
  if(act==='sfile'){addFiles([...t.files],id);t.value='';return;}
  if(t.id==='restore'){const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(String(rd.result));if(!Array.isArray(o.accounts)||!Array.isArray(o.txns))throw 0;S=Object.assign({profiles:{},imports:[],carry:true},o,{sample:false});save();ui.msg='Backup restored.';}catch(_){ui.msg='That file is not a backup from this app.';}render();};if(t.files[0])rd.readAsText(t.files[0]);return;}
  if(t.id==='dbud'){S.debt.budget=Math.abs(parseAmt(t.value)||0);save();render();return;}
  if(t.id==='rvm'){ui.rvm=t.value;render();return;}
  if(t.id==='flagmin'){S.flagMin=Math.abs(parseAmt(t.value)||0)||20000;save();render();return;}
  if(t.id==='bmonth'){ui.bmonth=t.value;render();return;}
  if(t.id==='rprop'||t.id==='ryear'||t.id==='rline'){ui[t.id]=t.value;render();return;}
  if(t.id==='norent'){S.noRentalBudget=t.checked;save();render();return;}
  if(t.id==='carry'){S.carry=t.checked;save();render();return;}
  if(act==='qmap'){const q=Q(id),i=+t.dataset.i,v=t.value;if(v!=='ignore')q.map=q.map.map((r,j)=>j!==i&&r===v?'ignore':r);q.map[i]=v;render();}
  else if(act==='qset'){const q=Q(id);q[t.dataset.k]=t.value;if(t.dataset.k!=='newName'&&t.dataset.k!=='anchorVal'&&t.dataset.k!=='anchorDate')render();}
  else if(act==='aname'){const a=acct(id);if(t.value.trim()){a.name=t.value.trim();save();render();}}
  else if(act==='atype'){const a=acct(id),was=isLiab(a);a.type=t.value;if(was!==isLiab(a)){if(a.anchor)a.anchor.value=-a.anchor.value;a.snaps.forEach(s=>s.value=-s.value);}save();render();}
  else if(act==='bset'){const v=parseAmt(t.value);if(v>0)S.budget[t.dataset.cat]=v;else delete S.budget[t.dataset.cat];save();render();}
  else if(act==='dset'){const a=acct(id);if(t.dataset.k==='apr')a.apr=t.value.replace(/[^0-9.]/g,'');else if(t.dataset.k==='limit')a.limit=Math.abs(parseAmt(t.value)||0);else a.minPay=Math.abs(parseAmt(t.value)||0);save();render();}
  else if(act==='dinc'){acct(id).inPlan=t.checked;save();render();}
  else if(act==='gset'){const g=S.goals.find(g=>g.id===id);g[t.dataset.k]=Math.abs(parseAmt(t.value)||0);save();render();}
  else if(act==='rvchk'){const m=t.dataset.m;S.review[m]=S.review[m]||{};S.review[m][t.dataset.i]=t.checked;save();}
  else if(act==='hstart'){const a=acct(id);a.start=a.start||{};a.start[t.dataset.sym]=t.value.replace(/[^0-9.]/g,'');save();render();}
  else if(act==='bilinc'){S.billOff[t.dataset.key]=!t.checked;save();render();}
  else if(act==='bilday'){const d=parseInt(t.value);if(d>=1&&d<=31){S.billDay[t.dataset.key]=d;const k=t.dataset.key;if(k.startsWith('u:')){const b=S.bills.find(x=>'u:'+x.id===k);if(b)b.day=d;}save();}render();}
  else if(act==='pacct'){const a=acct(id);if(t.value)a.prop=t.value;else delete a.prop;save();render();}
  else if(act==='tprop'){const x=S.txns.find(x=>x.id===id);x.prop=t.value||'none';save();render();}
  else if(act==='ttax'){const x=S.txns.find(x=>x.id===id);x.tax=t.value;save();render();}
  else if(act==='tcat'){const x=S.txns.find(x=>x.id===id);S.rules[mkey(x.desc)]=t.value;save();render();}
  else if(act==='txf'){ui[t.dataset.k]=t.value;ui.txLimit=150;render();}
});
let qt;document.addEventListener('input',e=>{const it=e.target;if(it.dataset.act==='qset'&&it.tagName==='INPUT'){const q=Q(it.dataset.id);if(q)q[it.dataset.k]=it.value;return;}if(e.target.id==='txq'){ui.txQ=e.target.value;clearTimeout(qt);qt=setTimeout(()=>{render();const i=$('#txq');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}},200);}});
document.addEventListener('dragover',e=>{const d=$('#drop');if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){e.preventDefault();if(d)d.classList.add('over');}});
document.addEventListener('dragleave',()=>{const d=$('#drop');if(d)d.classList.remove('over');});
document.addEventListener('drop',e=>{if(e.dataTransfer&&e.dataTransfer.files.length){e.preventDefault();ui.tab='import';addFiles([...e.dataTransfer.files]);}});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(ui.tab==='overview')drawCharts();if(ui.tab==='debt')drawDebt();if(ui.tab==='bills')drawBills();if(ui.tab==='budget')drawTrend();},150);});
async function saveFile(filename,data){if(!downloads)return;try{await downloads.save({filename,data});}catch(err){if(err&&err.code!=='declined'){ui.msg='The file could not be saved from this view.';render();}}}

/* ---------- boot ---------- */
if(!load())ui.tab='setup';
const h=(location.hash||'').slice(1);if(['setup','overview','review','budget','bills','debt','goals','rent','import','accounts','transactions'].includes(h))ui.tab=h;
render();
if(window.claude&&window.claude.use)window.claude.use('downloads').then(d=>{downloads=d;if(d)render();}).catch(()=>{});
else if(window.STANDALONE){downloads={save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=filename;document.body.appendChild(a);a.click();a.remove();}};render();}
