<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg:#fffaf6; --card:#ffffff; --fg:#3a2e3d; --muted:#8c7f8e; --line:#f1e4e6;
    --accent:#ff6f91; --accent-ink:#ffffff; --soft:#ffe9ee; --alt:#c9bfd0;
    --start:#4fc9a4; --me:#5aa9ff; --shadow:0 6px 22px rgba(120,70,90,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#221d27; --card:#2b2531; --fg:#f7eef5; --muted:#a999ad; --line:#3d3444;
      --accent:#ff8fab; --accent-ink:#2a1820; --soft:#40303a; --alt:#75697b;
      --start:#5fd6b2; --me:#77b8ff; --shadow:0 6px 22px rgba(0,0,0,.45);
    }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; margin:0; font:600 15px/1.35 Nunito, ui-rounded, "SF Pro Rounded", system-ui, sans-serif; color:var(--fg); background:var(--bg); }
  #map { position:absolute; inset:0; z-index:0; background:var(--bg); }
  .panel { position:absolute; left:10px; right:10px; z-index:1000; max-width:440px; background:var(--card); border-radius:22px; box-shadow:var(--shadow); }
  #top { top:calc(10px + env(safe-area-inset-top)); padding:10px; }
  #bottom { bottom:calc(10px + env(safe-area-inset-bottom)); display:none; overflow:hidden; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:8px; }
  .row:last-child { margin-bottom:0; }
  .field { flex:1; min-width:0; display:flex; align-items:center; gap:9px; padding:0 12px; border-radius:999px; background:var(--bg); border:2px solid var(--line); }
  .field:focus-within { border-color:var(--accent); }
  .field i { flex:0 0 auto; width:11px; height:11px; border-radius:50%; background:var(--start); }
  .field i.to { background:var(--accent); }
  input[type=text] { flex:1; min-width:0; font:inherit; padding:10px 0; border:0; outline:0; background:transparent; color:var(--fg); }
  input::placeholder { color:var(--muted); }
  button { font:inherit; font-weight:700; padding:10px 14px; border:0; border-radius:999px; background:var(--soft); color:var(--fg); cursor:pointer; white-space:nowrap; transition:transform .08s; }
  button:active { transform:scale(.95); }
  button.on, button.go { background:var(--accent); color:var(--accent-ink); }
  button.ghost { background:transparent; color:var(--muted); }
  .seg { display:flex; background:var(--bg); border-radius:999px; padding:3px; border:2px solid var(--line); }
  .seg button { padding:6px 12px; background:transparent; color:var(--muted); }
  .seg button.on { background:var(--accent); color:var(--accent-ink); }
  label.chip { display:flex; align-items:center; padding:7px 11px; border-radius:999px; background:var(--bg); border:2px solid var(--line); color:var(--muted); font-size:13px; white-space:nowrap; cursor:pointer; }
  label.chip input { display:none; }
  label.chip.on { background:var(--soft); border-color:var(--accent); color:var(--fg); }
  label.chip.off { opacity:.4; pointer-events:none; }
  #suggest { list-style:none; margin:0 0 8px; padding:4px; border-radius:16px; background:var(--bg); display:none; max-height:40vh; overflow:auto; }
  #suggest li { padding:9px 12px; border-radius:12px; cursor:pointer; }
  #suggest li:hover { background:var(--soft); }
  #suggest small { display:block; color:var(--muted); font-weight:500; }
  #status { flex:1; font-size:13px; color:var(--muted); min-height:1em; padding-left:6px; }
  #routes { display:flex; gap:8px; padding:10px; overflow-x:auto; align-items:stretch; }
  #routes button { flex:0 0 auto; text-align:left; border-radius:16px; font-size:16px; }
  #routes button small { display:block; font-size:12px; font-weight:600; opacity:.8; }
  #routes button.go { margin-left:auto; padding:10px 22px; font-size:17px; font-weight:800; }
  #stepsHead { display:flex; justify-content:space-between; align-items:center; padding:0 14px 6px; font-size:13px; color:var(--muted); }
  #stepsHead button { padding:4px 10px; font-size:13px; }
  #steps { list-style:none; margin:0; padding:0 6px 6px; max-height:30vh; overflow:auto; }
  #steps li { padding:9px 10px; border-radius:12px; display:flex; justify-content:space-between; gap:10px; cursor:pointer; font-weight:500; }
  #steps li:nth-child(odd) { background:var(--bg); }
  #steps li span:last-child { color:var(--muted); white-space:nowrap; font-size:13px; }

  /* Navigation mode */
  #nav, #navbar { display:none; }
  body.nav #top, body.nav #bottom { display:none !important; }
  body.nav #nav { display:block; top:calc(10px + env(safe-area-inset-top)); padding:14px 18px; background:var(--accent); color:var(--accent-ink); }
  #navDist { font-size:30px; font-weight:800; line-height:1.1; }
  #navText { font-size:19px; font-weight:700; margin-top:2px; }
  #navThen { font-size:13px; opacity:.85; margin-top:6px; font-weight:600; }
  body.nav #navbar { display:flex; bottom:calc(10px + env(safe-area-inset-bottom)); padding:10px 10px 10px 18px; align-items:center; gap:8px; }
  #navEta { flex:1; }
  #navEta b { display:block; font-size:22px; font-weight:800; }
  #navEta span { font-size:13px; color:var(--muted); }
  #recenter { display:none; }

  @media (max-width:520px) { .leaflet-control-zoom { display:none; } }
  .tiles { filter:saturate(.8) sepia(.14) hue-rotate(-10deg) brightness(1.04); }
  @media (prefers-color-scheme: dark) { .tiles { filter:invert(1) hue-rotate(180deg) saturate(.6) brightness(.85) contrast(.9); } }
  .leaflet-container { font:inherit; background:var(--bg); }
  .leaflet-control-attribution { font-size:10px; border-radius:10px 0 0 0; }
  .leaflet-bar { border:0 !important; box-shadow:var(--shadow) !important; border-radius:16px !important; overflow:hidden; }
  .leaflet-bar a { background:var(--card) !important; color:var(--fg) !important; border:0 !important; }
  .leaflet-popup-content-wrapper { border-radius:18px; background:var(--card); color:var(--fg); box-shadow:var(--shadow); }
  .leaflet-popup-tip { background:var(--card); }
  .leaflet-popup-content { margin:10px; }
  .pop button { display:block; width:100%; margin-top:6px; }
  .pop button:first-child { margin-top:0; }
  .pin { width:26px; height:26px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); background:var(--accent); border:3px solid #fff; box-shadow:0 3px 8px rgba(0,0,0,.3); }
  .pin.from { background:var(--start); }
  .pin::after { content:""; position:absolute; inset:5px; border-radius:50%; background:#fff; }
  .me { width:18px; height:18px; border-radius:50%; background:var(--me); border:3px solid #fff; box-shadow:0 0 0 0 rgba(90,169,255,.6); animation:pulse 1.8s infinite; }
  @keyframes pulse { 70% { box-shadow:0 0 0 14px rgba(90,169,255,0); } 100% { box-shadow:0 0 0 0 rgba(90,169,255,0); } }
</style>
</head>
<body>
<div id="map"></div>

<div id="top" class="panel">
  <div class="row">
    <div class="field"><i></i><input id="from" type="text" placeholder="Starting from..." autocomplete="off"></div>
    <button id="here" title="Use my current location">Here</button>
  </div>
  <div class="row">
    <div class="field"><i class="to"></i><input id="to" type="text" placeholder="Where to?" autocomplete="off"></div>
    <button id="swap" title="Swap start and destination">Swap</button>
  </div>
  <ul id="suggest"></ul>
  <div class="row">
    <div class="seg" id="mode">
      <button data-mode="auto" class="on">Drive</button>
      <button data-mode="bicycle">Bike</button>
      <button data-mode="pedestrian">Walk</button>
    </div>
    <label class="chip" id="noHwyL"><input id="noHwy" type="checkbox">No highways</label>
    <label class="chip" id="noTollL"><input id="noToll" type="checkbox">No tolls</label>
  </div>
  <div class="row">
    <span id="status"></span>
    <button id="follow">Find me</button>
    <button id="clear" class="ghost">Clear</button>
  </div>
</div>

<div id="bottom" class="panel">
  <div id="routes"></div>
  <div id="stepsHead"><span id="stepsTitle">Directions</span><button id="toggleSteps" class="ghost">Hide</button></div>
  <ol id="steps"></ol>
</div>

<div id="nav" class="panel">
  <div id="navDist"></div>
  <div id="navText">Finding your location...</div>
  <div id="navThen"></div>
</div>
<div id="navbar" class="panel">
  <div id="navEta"><b id="navArrive">--</b><span id="navLeft"></span></div>
  <button id="recenter" class="go">Recenter</button>
  <button id="mute">Sound on</button>
  <button id="endNav">End</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ---------- Services (all built on OpenStreetMap data; swap these URLs to self-host or change provider) ----------
const TILE_URL  = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';   // standard OpenStreetMap tiles, no key needed
const GEOCODER  = 'https://photon.komoot.io';               // Photon: OSM-based search
const ROUTER    = 'https://valhalla1.openstreetmap.de';     // Valhalla: OSM-based routing (FOSSGIS public server)
const ROUTER2   = 'https://routing.openstreetmap.de';       // OSRM: backup routing, used when Valhalla refuses or is down

// ---------- State ----------
const $ = id => document.getElementById(id);
const pts = { from: null, to: null };      // {lat, lon, label}
const markers = { from: null, to: null };
let routes = [], lines = [], selected = 0, reqId = 0, mode = 'auto';
let watchId = null, meDot = null, nav = null, wake = null, useBackup = false;

function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
let muted = !!store('map.muted');

// ---------- Map ----------
const saved = store('map.view');
const map = L.map('map', { zoomControl: false }).setView(saved ? saved.c : [39.5, -98.35], saved ? saved.z : 4);
L.control.zoom({ position: 'bottomright' }).addTo(map);
L.tileLayer(TILE_URL, {
  maxZoom: 19, className: 'tiles',
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);
map.on('moveend', () => { const c = map.getCenter(); store('map.view', { c: [c.lat, c.lng], z: map.getZoom() }); });
map.on('dragstart', () => { if (nav) { nav.follow = false; $('recenter').style.display = 'block'; } });

map.on('click', e => {
  if (nav) return;
  const div = document.createElement('div'); div.className = 'pop';
  [['Start here', 'from'], ['Go here', 'to']].forEach(([txt, which]) => {
    const b = document.createElement('button'); b.textContent = txt;
    if (which === 'to') b.className = 'go';
    b.onclick = () => { map.closePopup(); setPointFromLatLng(which, e.latlng.lat, e.latlng.lng); };
    div.appendChild(b);
  });
  L.popup({ closeButton: false }).setLatLng(e.latlng).setContent(div).openOn(map);
});

// ---------- Helpers ----------
function status(msg) { $('status').textContent = msg || ''; }
function fmtDist(mi) { return mi < 0.1 ? Math.max(10, Math.round(mi * 5280 / 10) * 10) + ' ft' : (mi < 10 ? mi.toFixed(1) : Math.round(mi)) + ' mi'; }
function fmtTime(s) { const m = Math.max(1, Math.round(s / 60)); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + (m % 60) + ' min'; }
function labelOf(p) {
  const main = p.name || [p.housenumber, p.street].filter(Boolean).join(' ') || p.city || 'Unnamed place';
  const street = p.name && p.street ? [p.housenumber, p.street].filter(Boolean).join(' ') : null;
  const sub = [street, p.city !== main ? p.city : null, p.state, p.country !== 'United States' ? p.country : null].filter(Boolean).join(', ');
  return { main, sub };
}
function decodePolyline(str, precision) {
  let i = 0, lat = 0, lng = 0; const out = [], f = Math.pow(10, precision || 6);
  while (i < str.length) {
    let b, shift = 0, result = 0;
    do { b = str.charCodeAt(i++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    lat += (result & 1) ? ~(result >> 1) : (result >> 1);
    shift = 0; result = 0;
    do { b = str.charCodeAt(i++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    lng += (result & 1) ? ~(result >> 1) : (result >> 1);
    out.push([lat / f, lng / f]);
  }
  return out;
}
function meters(a, b) {   // haversine distance between [lat, lon] pairs
  const R = 6371000, r = Math.PI / 180, dLat = (b[0] - a[0]) * r, dLon = (b[1] - a[1]) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function pinIcon(which) { return L.divIcon({ className: '', html: '<div class="pin ' + which + '"></div>', iconSize: [26, 26], iconAnchor: [13, 31] }); }
function showMe(ll) {
  if (!meDot) meDot = L.marker(ll, { icon: L.divIcon({ className: '', html: '<div class="me"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }), interactive: false, zIndexOffset: 1000 }).addTo(map);
  else meDot.setLatLng(ll);
}

// ---------- Search ----------
let debounce;
['from', 'to'].forEach(which => {
  const el = $(which);
  el.addEventListener('focus', () => el.select());
  el.addEventListener('input', () => {
    pts[which] = null;
    clearTimeout(debounce);
    debounce = setTimeout(() => search(which, el.value.trim()), 300);
  });
});

async function search(which, q) {
  const list = $('suggest');
  if (q.length < 3) { list.style.display = 'none'; return; }
  const m = q.match(/^\s*(-?\d+(\.\d+)?)\s*,\s*(-?\d+(\.\d+)?)\s*$/);   // raw "lat, lon"
  if (m) { list.style.display = 'none'; setPoint(which, { lat: +m[1], lon: +m[3], label: q }); return; }
  const c = map.getCenter(), id = ++reqId;
  try {
    const r = await fetch(`${GEOCODER}/api/?q=${encodeURIComponent(q)}&limit=6&lang=en&lat=${c.lat.toFixed(4)}&lon=${c.lng.toFixed(4)}`);
    const data = await r.json();
    if (id !== reqId) return;   // a newer search superseded this one
    list.innerHTML = '';
    (data.features || []).forEach(f => {
      const { main, sub } = labelOf(f.properties), li = document.createElement('li');
      li.textContent = main;
      if (sub) { const s = document.createElement('small'); s.textContent = sub; li.appendChild(s); }
      li.onclick = () => {
        list.style.display = 'none';
        setPoint(which, { lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0], label: sub ? main + ', ' + sub : main });
      };
      list.appendChild(li);
    });
    list.style.display = list.children.length ? 'block' : 'none';
    status(list.children.length ? '' : 'No matches for "' + q + '"');
  } catch (e) { status('Search failed. Check connection.'); }
}

async function setPointFromLatLng(which, lat, lon) {
  setPoint(which, { lat, lon, label: lat.toFixed(5) + ', ' + lon.toFixed(5) });
  try {   // replace the coordinates with a readable name if one exists
    const r = await fetch(`${GEOCODER}/reverse?lat=${lat}&lon=${lon}&lang=en`);
    const f = (await r.json()).features[0];
    if (f && pts[which] && pts[which].lat === lat) {
      const { main, sub } = labelOf(f.properties);
      pts[which].label = sub ? main + ', ' + sub : main;
      $(which).value = pts[which].label;
    }
  } catch (e) {}
}

function setPoint(which, p) {
  pts[which] = p;
  $(which).value = p.label;
  if (markers[which]) markers[which].remove();
  markers[which] = L.marker([p.lat, p.lon], { icon: pinIcon(which) }).addTo(map);
  if (pts.from && pts.to) route(); else map.setView([p.lat, p.lon], Math.max(map.getZoom(), 14));
}

// ---------- Routing ----------
// Both routers return the same shape: [{ time (s), dist (mi), coords [[lat, lon]], steps [{ instruction, begin_shape_index, end_shape_index, length (mi), time (s) }] }]
async function valhallaRoutes(quiet) {
  const body = {
    locations: [{ lat: pts.from.lat, lon: pts.from.lon }, { lat: pts.to.lat, lon: pts.to.lon }],
    costing: mode, alternates: quiet ? 0 : 2, units: 'miles', language: 'en-US'
  };
  if (mode === 'auto') body.costing_options = { auto: {
    use_highways: $('noHwy').checked ? 0 : 1,
    use_tolls: $('noToll').checked ? 0 : 0.5
  } };
  const r = await fetch(`${ROUTER}/route?json=${encodeURIComponent(JSON.stringify(body))}`);
  const data = await r.json();
  if (!data.trip) { const e = new Error(data.error || data.message || 'No route found.'); e.noRoute = r.status === 400; throw e; }
  return [data.trip].concat((data.alternates || []).map(a => a.trip)).map(t => ({
    time: t.summary.time, dist: t.summary.length,
    coords: decodePolyline(t.legs[0].shape, 6),
    steps: t.legs[0].maneuvers
  }));
}

function osrmText(st) {   // OSRM gives maneuver codes, not sentences
  const m = st.maneuver, mod = m.modifier || '', name = st.name || st.ref || '', onto = name ? ' onto ' + name : '', on = name ? ' on ' + name : '';
  const turn = mod === 'uturn' ? 'Make a U-turn' : mod === 'straight' ? 'Continue straight' : 'Turn ' + mod;
  switch (m.type) {
    case 'depart': { const d = ['north', 'northeast', 'east', 'southeast', 'south', 'southwest', 'west', 'northwest'][Math.round((m.bearing_after || 0) / 45) % 8]; return 'Head ' + d + on + '.'; }
    case 'arrive': return 'You have arrived at your destination.';
    case 'new name': return 'Continue' + onto + '.';
    case 'continue': return mod === 'straight' || !mod ? 'Continue' + on + '.' : turn + ' to stay' + on + '.';
    case 'merge': return 'Merge' + onto + '.';
    case 'on ramp': return 'Take the ramp' + (mod.includes('left') ? ' on the left' : mod.includes('right') ? ' on the right' : '') + (st.destinations ? ' toward ' + st.destinations.split(',')[0] : onto) + '.';
    case 'off ramp': return 'Take the exit' + (mod.includes('left') ? ' on the left' : mod.includes('right') ? ' on the right' : '') + (st.destinations ? ' toward ' + st.destinations.split(',')[0] : onto) + '.';
    case 'fork': return 'Keep ' + (mod.includes('left') ? 'left' : mod.includes('right') ? 'right' : 'straight') + ' at the fork' + onto + '.';
    case 'end of road': return turn + ' at the end of the road' + onto + '.';
    case 'roundabout': case 'rotary': return 'At the roundabout, take exit ' + (m.exit || 1) + onto + '.';
    case 'exit roundabout': case 'exit rotary': return 'Exit the roundabout' + onto + '.';
    case 'roundabout turn': return 'At the roundabout, ' + turn.toLowerCase() + onto + '.';
    default: return turn + onto + '.';
  }
}

async function osrmRoutes(quiet) {
  const profile = { auto: 'car', bicycle: 'bike', pedestrian: 'foot' }[mode];
  const base = `${ROUTER2}/routed-${profile}/route/v1/driving/${pts.from.lon},${pts.from.lat};${pts.to.lon},${pts.to.lat}?overview=false&steps=true&geometries=polyline6&alternatives=${quiet ? 'false' : 3}`;
  const ex = mode === 'auto' ? [$('noHwy').checked && 'motorway', $('noToll').checked && 'toll'].filter(Boolean).join(',') : '';
  let data = await (await fetch(base + (ex ? '&exclude=' + ex : ''))).json(), note = '';
  if (data.code !== 'Ok' && ex) {   // this server may not support avoiding highways or tolls
    data = await (await fetch(base)).json();
    note = 'Backup router in use: highway and toll avoidance not applied.';
  }
  if (data.code !== 'Ok') throw new Error(data.message || 'No route found.');
  const out = data.routes.map(rt => {
    const coords = [], steps = [];
    rt.legs[0].steps.forEach(st => {
      const g = decodePolyline(st.geometry, 6);
      if (coords.length) g.shift();   // each step starts where the previous one ended
      const begin = Math.max(0, coords.length - 1);
      g.forEach(c => coords.push(c));
      const text = osrmText(st);
      steps.push({ instruction: text, verbal_pre_transition_instruction: text, begin_shape_index: begin, end_shape_index: coords.length - 1, length: st.distance / 1609.34, time: st.duration });
    });
    return { time: rt.duration, dist: rt.distance / 1609.34, coords, steps };
  });
  out.note = note;
  return out;
}

async function route(quiet) {
  if (!pts.from || !pts.to) return false;
  if (!quiet) status('Finding routes...');
  const id = ++reqId;
  let found = null, why = '';
  if (!useBackup) {
    try { found = await valhallaRoutes(quiet); }
    catch (e) { why = e.message; if (e.noRoute) { if (id === reqId) status(why); return false; } }
  }
  if (!found) {
    try { found = await osrmRoutes(quiet); useBackup = true; }
    catch (e) { if (id === reqId) status(e.message && !/fetch/i.test(e.message) ? e.message : 'Routing is unavailable right now. Try again in a moment.'); return false; }
  }
  if (id !== reqId) return false;
  routes = found; selected = 0;
  draw(!quiet);
  status(found.note || '');
  writeHash();
  return true;
}

function draw(fit) {
  lines.forEach(l => l.remove()); lines = [];
  const css = getComputedStyle(document.documentElement), v = n => css.getPropertyValue(n).trim();
  routes.forEach((rt, i) => {   // draw unselected first so the selected line sits on top
    if (i === selected) return;
    lines.push(L.polyline(rt.coords, { color: v('--alt'), weight: 6, opacity: .9, lineCap: 'round' })
      .on('click', ev => { L.DomEvent.stopPropagation(ev); selected = i; draw(false); }).addTo(map));
  });
  lines.push(L.polyline(routes[selected].coords, { color: '#fff', weight: 11, opacity: .9, lineCap: 'round', interactive: false }).addTo(map));
  const sel = L.polyline(routes[selected].coords, { color: v('--accent'), weight: 6, lineCap: 'round', interactive: false }).addTo(map);
  lines.push(sel);
  if (fit) map.fitBounds(sel.getBounds(), { paddingTopLeft: [20, 240], paddingBottomRight: [20, 130] });

  const fastest = Math.min.apply(null, routes.map(r => r.time));
  const box = $('routes'); box.innerHTML = '';
  routes.forEach((rt, i) => {
    const b = document.createElement('button'), s = document.createElement('small');
    b.textContent = fmtTime(rt.time);
    s.textContent = fmtDist(rt.dist) + (rt.time === fastest ? ' - fastest' : ' - +' + fmtTime(rt.time - fastest));
    b.appendChild(s);
    if (i === selected) b.className = 'on';
    b.onclick = () => { selected = i; draw(true); };
    box.appendChild(b);
  });
  const go = document.createElement('button'); go.className = 'go'; go.textContent = 'Start'; go.onclick = startNav;
  box.appendChild(go);

  const ol = $('steps'); ol.innerHTML = '';
  routes[selected].steps.forEach(st => {
    const li = document.createElement('li'), a = document.createElement('span'), d = document.createElement('span');
    a.textContent = st.instruction; d.textContent = st.length ? fmtDist(st.length) : '';
    li.append(a, d);
    li.onclick = () => map.setView(routes[selected].coords[st.begin_shape_index], 17);
    ol.appendChild(li);
  });
  $('stepsTitle').textContent = routes[selected].steps.length + ' steps';
  $('bottom').style.display = 'block';
}

// ---------- Turn-by-turn navigation ----------
function say(text) {
  if (muted || !text || !window.speechSynthesis) return;
  try { speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(text)); } catch (e) {}
}
function spokenDist(m) {
  const mi = m / 1609.34;
  if (mi < 0.1) return Math.max(50, Math.round(m * 3.281 / 50) * 50) + ' feet';
  if (mi < 0.35) return 'a quarter mile';
  if (mi < 0.7) return 'half a mile';
  return (mi < 10 ? Math.round(mi * 2) / 2 : Math.round(mi)) + ' miles';
}
async function keepAwake() { try { if (navigator.wakeLock && nav) wake = await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

function loadNavRoute() {   // (re)build the progress tables for the current route
  const rt = routes[selected], cum = [0];
  for (let i = 1; i < rt.coords.length; i++) cum.push(cum[i - 1] + meters(rt.coords[i - 1], rt.coords[i]));
  Object.assign(nav, { rt, cum, seg: 0, step: -1, off: 0, said: {} });
}

function startNav() {
  if (!routes.length) return;
  if (!navigator.geolocation) { status('Location is not available in this browser.'); return; }
  stopFollow();
  nav = { follow: true, lastReroute: 0, busy: false };
  loadNavRoute();
  document.body.classList.add('nav');
  $('recenter').style.display = 'none';
  $('mute').textContent = muted ? 'Sound off' : 'Sound on';
  $('navDist').textContent = ''; $('navText').textContent = 'Finding your location...'; $('navThen').textContent = '';
  $('navArrive').textContent = '--'; $('navLeft').textContent = '';
  say('Starting directions.');   // spoken inside the tap so phones allow later prompts
  keepAwake();
  nav.watch = navigator.geolocation.watchPosition(onFix,
    e => {   // only a denied permission is fatal; a lost signal recovers on the next fix
      if (e.code === 1) { $('navDist').textContent = ''; $('navThen').textContent = ''; $('navText').textContent = 'Location is off. Allow location for this site to navigate.'; }
    },
    { enableHighAccuracy: true, maximumAge: 1000 });
}

function endNav() {
  if (!nav) return;
  navigator.geolocation.clearWatch(nav.watch);
  nav = null;
  document.body.classList.remove('nav');
  try { if (wake) wake.release(); } catch (e) {}
  wake = null;
  if (window.speechSynthesis) speechSynthesis.cancel();
}

// Closest point on the route to ll. Searches near the last known segment first, then the whole route.
function snap(ll) {
  const c = nav.rt.coords, kx = Math.cos(ll[0] * Math.PI / 180);
  function scan(a, b) {
    let best = { d: Infinity, i: 0, t: 0 };
    for (let i = Math.max(0, a); i < Math.min(c.length - 1, b); i++) {
      const ax = (c[i][1] - ll[1]) * kx, ay = c[i][0] - ll[0], bx = (c[i + 1][1] - ll[1]) * kx, by = c[i + 1][0] - ll[0];
      const dx = bx - ax, dy = by - ay, len = dx * dx + dy * dy;
      const t = len ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / len)) : 0;
      const px = ax + t * dx, py = ay + t * dy, d = Math.sqrt(px * px + py * py) * 111320;
      if (d < best.d) best = { d, i, t };
    }
    return best;
  }
  let s = scan(nav.seg - 3, nav.seg + 150);
  if (s.d > 50) s = scan(0, c.length);
  return s;
}

async function reroute(ll) {
  nav.busy = true; nav.lastReroute = Date.now();
  $('navText').textContent = 'Rerouting...'; $('navDist').textContent = ''; $('navThen').textContent = '';
  say('Rerouting.');
  pts.from = { lat: ll[0], lon: ll[1], label: 'My location' };
  $('from').value = 'My location';
  if (markers.from) { markers.from.remove(); markers.from = null; }
  const ok = await route(true);
  if (!nav) return;
  if (ok) loadNavRoute();
  nav.busy = false;
}

function onFix(p) {
  if (!nav) return;
  const ll = [p.coords.latitude, p.coords.longitude];
  showMe(ll);
  if (nav.follow) map.setView(ll, Math.max(map.getZoom(), 17));
  if (nav.busy) return;

  const s = snap(ll), acc = p.coords.accuracy || 0;
  if (s.d > Math.max(50, acc)) {   // off the route: wait for three fixes in a row before rerouting
    if (++nav.off >= 3 && Date.now() - nav.lastReroute > 8000) reroute(ll);
    return;
  }
  nav.off = 0; nav.seg = s.i;
  const rt = nav.rt, cum = nav.cum, steps = rt.steps;
  const along = cum[s.i] + s.t * (cum[s.i + 1] - cum[s.i]), left = cum[cum.length - 1] - along;

  let cur = 0;
  for (let i = 0; i < steps.length; i++) if (steps[i].begin_shape_index <= s.i) cur = i;
  if (cur >= steps.length - 1) cur = Math.max(0, steps.length - 2);
  const next = steps[cur + 1], after = steps[cur + 2];
  const toNext = next ? Math.max(0, cum[next.begin_shape_index] - along) : left;

  if (left < 25) {   // arrived
    say(next && next.verbal_pre_transition_instruction || 'You have arrived.');
    endNav(); status('You have arrived.');
    return;
  }

  // Remaining time: the rest of this step, scaled by how much of it is left, plus all later steps
  const curLen = cum[steps[cur].end_shape_index] - cum[steps[cur].begin_shape_index];
  let secs = (steps[cur].time || 0) * (curLen ? Math.min(1, toNext / curLen) : 0);
  for (let i = cur + 1; i < steps.length; i++) secs += steps[i].time || 0;

  $('navDist').textContent = fmtDist(toNext / 1609.34);
  $('navText').textContent = next ? next.instruction : 'Continue';
  $('navThen').textContent = after ? 'Then: ' + after.instruction : '';
  $('navArrive').textContent = new Date(Date.now() + secs * 1000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  $('navLeft').textContent = fmtTime(secs) + ' - ' + fmtDist(left / 1609.34);

  // Voice prompts: once on entering a step, once on approach, once at the turn
  const phrase = next && (next.verbal_pre_transition_instruction || next.instruction);
  const speed = p.coords.speed > 0 ? p.coords.speed : 0, near = Math.max(45, speed * 5), early = Math.max(400, speed * 20);
  if (cur !== nav.step) {
    nav.step = cur;
    if (toNext > early * 1.5) { say('Continue for ' + spokenDist(toNext) + '.'); return; }
  }
  if (!phrase) return;
  if (toNext <= near) { if (!nav.said[cur + 'b']) { nav.said[cur + 'b'] = nav.said[cur + 'a'] = 1; say(phrase); } }
  else if (toNext <= early && !nav.said[cur + 'a']) { nav.said[cur + 'a'] = 1; say('In ' + spokenDist(toNext) + ', ' + phrase); }
}

$('endNav').onclick = endNav;
$('recenter').onclick = () => { if (!nav) return; nav.follow = true; $('recenter').style.display = 'none'; if (meDot) map.setView(meDot.getLatLng(), 17); };
$('mute').onclick = () => {
  muted = !muted; store('map.muted', muted);
  $('mute').textContent = muted ? 'Sound off' : 'Sound on';
  if (muted && window.speechSynthesis) speechSynthesis.cancel();
};

// ---------- Controls ----------
function setMode(m) {
  mode = m;
  document.querySelectorAll('#mode button').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  ['noHwyL', 'noTollL'].forEach(id => $(id).classList.toggle('off', m !== 'auto'));
}
function syncChips() { ['noHwy', 'noToll'].forEach(id => $(id + 'L').classList.toggle('on', $(id).checked)); }
function saveOpts() { store('map.opts', { mode, noHwy: $('noHwy').checked, noToll: $('noToll').checked }); }
document.querySelectorAll('#mode button').forEach(b => b.onclick = () => { setMode(b.dataset.mode); saveOpts(); route(); });
$('noHwy').onchange = $('noToll').onchange = () => { syncChips(); saveOpts(); route(); };

function clearPoints() {
  ['from', 'to'].forEach(w => { if (markers[w]) { markers[w].remove(); markers[w] = null; } pts[w] = null; $(w).value = ''; });
}
$('swap').onclick = () => {
  const a = pts.from, b = pts.to;
  clearPoints();
  if (b) setPoint('from', b);
  if (a) setPoint('to', a);
};
$('clear').onclick = () => {
  clearPoints();
  lines.forEach(l => l.remove()); lines = []; routes = [];
  $('bottom').style.display = 'none'; $('suggest').style.display = 'none';
  status(''); history.replaceState(null, '', location.pathname);
};
$('toggleSteps').onclick = () => {
  const hidden = $('steps').style.display === 'none';
  $('steps').style.display = hidden ? '' : 'none';
  $('toggleSteps').textContent = hidden ? 'Hide' : 'Show';
};

$('here').onclick = () => {
  if (!navigator.geolocation) { status('Location is not available in this browser.'); return; }
  status('Getting your location...');
  navigator.geolocation.getCurrentPosition(
    p => { status(''); showMe([p.coords.latitude, p.coords.longitude]); setPoint('from', { lat: p.coords.latitude, lon: p.coords.longitude, label: 'My location' }); },
    () => status('Location is off. Allow location for this site.'),
    { enableHighAccuracy: true, timeout: 10000 });
};

function stopFollow() {
  if (watchId === null) return;
  navigator.geolocation.clearWatch(watchId); watchId = null;
  $('follow').className = '';
}
$('follow').onclick = () => {
  if (watchId !== null) { stopFollow(); return; }
  if (!navigator.geolocation) { status('Location is not available in this browser.'); return; }
  $('follow').className = 'on';
  watchId = navigator.geolocation.watchPosition(p => {
    const ll = [p.coords.latitude, p.coords.longitude];
    showMe(ll);
    map.setView(ll, Math.max(map.getZoom(), 16));
  }, () => { status('Location is off. Allow location for this site.'); stopFollow(); },
  { enableHighAccuracy: true, maximumAge: 2000 });
};

// ---------- Shareable link: route lives in the URL hash (never sent to a server) ----------
function writeHash() {
  const f = pts.from, t = pts.to;
  history.replaceState(null, '', '#from=' + f.lat.toFixed(5) + ',' + f.lon.toFixed(5) + '&to=' + t.lat.toFixed(5) + ',' + t.lon.toFixed(5) + '&mode=' + mode);
}
(function init() {
  const o = store('map.opts') || {}, h = new URLSearchParams(location.hash.slice(1));
  $('noHwy').checked = !!o.noHwy; $('noToll').checked = !!o.noToll;
  const m = h.get('mode') || o.mode;
  setMode(['auto', 'bicycle', 'pedestrian'].includes(m) ? m : 'auto');
  syncChips();
  const parse = s => { const p = (s || '').split(',').map(Number); return p.length === 2 && p.every(isFinite) ? p : null; };
  const f = parse(h.get('from')), t = parse(h.get('to'));
  if (f) setPointFromLatLng('from', f[0], f[1]);
  if (t) setPointFromLatLng('to', t[0], t[1]);
})();
</script>
</body>
</html>
