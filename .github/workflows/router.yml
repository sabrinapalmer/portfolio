name: Router data
# Builds routing data for BrinaMaps' own route server (Valhalla) from OpenStreetMap, ONE region per run, each region on
# its own day of the month so no machine is busy with all of them at once:
#   west (California + Mexico) on the 5th, texas on the 12th, illinois on the 19th.
# us (the whole US + Mexico in one piece, so any trip in either has one route) is built on demand for now.
# Each build is published as a release named router-<region>-<date>; the server picks it up within the hour.
on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Region to build'
        type: choice
        options: [west, texas, illinois, us]
        default: us
  schedule:
    - cron: '41 6 5 * *'
permissions:
  contents: write
concurrency:
  group: router
  cancel-in-progress: false   # a second build waits for the first instead of replacing it
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Pick the region
        run: |
          region="${{ inputs.region }}"
          case "${{ github.event.schedule }}" in '41 6 5 * *') region=us;; esac
          region=${region:-us}
          case "$region" in
            west) urls='https://download.geofabrik.de/north-america/us/california-latest.osm.pbf https://download.geofabrik.de/north-america/mexico-latest.osm.pbf';;
            texas) urls='https://download.geofabrik.de/north-america/us/texas-latest.osm.pbf';;
            illinois) urls='https://download.geofabrik.de/north-america/us/illinois-latest.osm.pbf';;
            us) urls='https://download.geofabrik.de/north-america/us-latest.osm.pbf https://download.geofabrik.de/north-america/mexico-latest.osm.pbf';;
            *) echo "::error::unknown region $region"; exit 1;;
          esac
          echo "REGION=$region" >> "$GITHUB_ENV"; echo "TILE_URLS=$urls" >> "$GITHUB_ENV"
          echo "::notice::building $region"
      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af >/dev/null || true
          sudo swapoff -a && sudo rm -f /mnt/swapfile /swapfile || true
          # Docker's own files (image, logs) on the big disk too: the whole-US build filled the small one
          sudo systemctl stop docker docker.socket || true
          sudo mkdir -p /mnt/docker && echo '{"data-root":"/mnt/docker","log-driver":"none"}' | sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl start docker
          sudo fallocate -l 12G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile >/dev/null && sudo swapon /mnt/swapfile || true
          df -h / /mnt | tail -2; free -g | head -3
      - name: Build routing tiles
        run: |
          mkdir -p /mnt/vh 2>/dev/null || sudo mkdir -p /mnt/vh; sudo chmod 777 /mnt/vh
          # Speed table (OpenStreetMapSpeeds): measured average speeds by country/state, used for every road it covers,
          # even roads with a posted limit. Its US rows are averages well under the limits (a 75 mph interstate became
          # 61 mph), and US roads were falling through to its worldwide row anyway. So the US and worldwide rows are
          # dropped: US roads use their posted limits (and Valhalla's own defaults where none is posted), while Mexico,
          # where few roads carry a posted limit in the map data, keeps its measured speeds.
          curl -sfL https://raw.githubusercontent.com/OpenStreetMapSpeeds/schema/master/default_speeds.json \
            | jq '[.[] | select(has("iso3166-1") and .["iso3166-1"] != "US")]' > /mnt/vh/default_speeds.json
          n=$(jq length /mnt/vh/default_speeds.json); [ "$n" -gt 1000 ] || { echo "::error::speed table download failed ($n rows)"; exit 1; }
          echo "::notice::speed table: $n rows (US and worldwide rows dropped)"
          docker run --rm --log-driver none -e tile_urls="$TILE_URLS" -e serve_tiles=False -e build_admins=True -e build_time_zones=True \
            -e build_elevation=False -e build_tar=True -e use_default_speeds_config=True -e server_threads=4 -v /mnt/vh:/custom_files ghcr.io/valhalla/valhalla-scripted:latest
          ls -la /mnt/vh; du -sh /mnt/vh/* || true; df -h / /mnt | tail -2
          sudo rm -rf /mnt/vh/valhalla_tiles /mnt/vh/*.pbf || true   # the tar holds the tiles; free the space for packing
      - name: Package
        run: |
          cd /mnt/vh
          echo "::notice::built files: $(ls -1 | tr '\n' ' ')"
          files=$(ls -1d valhalla_tiles.tar admins.sqlite timezones.sqlite valhalla.json 2>/dev/null | tr '\n' ' ')
          [ -n "$files" ] && echo "$files" | grep -q valhalla_tiles.tar || { echo "::error::no tile archive was built"; exit 1; }
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          sudo tar -cf - $files | zstd -T0 -9 -o "$out/router.tar.zst"
          cd "$out" && split -b 1900m -d router.tar.zst router.part. && rm router.tar.zst && ls -la
          echo "::notice::router data $(du -ch router.part.* | tail -1 | cut -f1) in $(ls router.part.* | wc -l) part(s): $files"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=router-$REGION-$(date -u +%Y%m%d-%H%M)
          gh release create "$tag" "$RUNNER_TEMP"/out/router.part.* --repo "$GITHUB_REPOSITORY" --title "Router data: $REGION $(date -u +%Y-%m-%d)" \
            --notes "Valhalla routing tiles ($REGION), built from OpenStreetMap (© OpenStreetMap contributors, ODbL). Downloaded by the BrinaMaps route server." --latest=false
          # keep the two newest builds
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | grep "^router-$REGION-" | sort -r | tail -n +3 | while read t; do gh release delete "$t" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag; done
          echo "::notice::published $tag"
