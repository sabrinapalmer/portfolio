name: Toll booths
on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-tolls.mjs
      - name: Commit if changed
        run: |
          git config user.name "toll-booth-bot"
          git config user.email "actions@users.noreply.github.com"
          git add brinamaps/public/map/data/tolls.json
          git diff --cached --quiet || (git commit -m "Map: weekly toll booth list" && git pull --rebase origin master && git push)
