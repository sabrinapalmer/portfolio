name: Places
# Builds BrinaMaps' own place list from Overture Maps and OpenStreetMap and loads it into the app's database.
# Runs on the 3rd of each month (Overture publishes monthly) and on demand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build only, load nothing'
        type: boolean
        default: false
  schedule:
    - cron: '23 8 3 * *'
  push:
    branches: [master]
    paths: ['scripts/places/**', '.github/workflows/places.yml']
permissions:
  contents: read
concurrency:
  group: places
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      # California, then Baja California and Baja California Sur (west,south,east,north)
      REGIONS: '-124.6,32.5,-114.1,42.1;-118.6,22.8,-109.3,32.75'
      OSM_EXTRACTS: 'https://download.geofabrik.de/north-america/us/california-latest.osm.pbf https://download.geofabrik.de/north-america/mexico-latest.osm.pbf'
      MIN_CONF: '0.6'
      MAX_ROWS: '700000'
      SUPABASE_URL: 'https://vtjkzkvimsywjjmuhrlg.supabase.co'
      SUPABASE_KEY: 'sb_publishable_mzTbHkZeezy73OgqtraEXA_MQ4tcm2P'
      IMPORT_TOKEN: ${{ secrets.PLACES_IMPORT_TOKEN }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - run: pip install -q duckdb
      - working-directory: ${{ runner.temp }}
        run: python $GITHUB_WORKSPACE/scripts/places/build_places.py
