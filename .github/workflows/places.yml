name: Places
# Builds BrinaMaps' own place list from Overture Maps and OpenStreetMap as one SQLite file (with its name and map
# indexes already built) and publishes it as a release named places-<date>. The route server downloads the newest one
# within the hour and swaps it in; nothing else has to be loaded anywhere.
# Runs on the 3rd of each month (Overture publishes monthly) and on demand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build only, publish nothing'
        type: boolean
        default: false
  schedule:
    - cron: '23 8 3 * *'
permissions:
  contents: write
concurrency:
  group: places
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      # name:west,south,east,north:share. The whole US in bands (each read, merged and written on its own, so the
      # build machine never holds all of it), plus Baja. Boxes may overlap: a place is kept once.
      REGIONS: 'pacific:-125,32.5,-114,49.1;mountain:-114,31.3,-102,49.1;plains:-102,25.8,-94,49.4;central:-94,28.9,-87,49.4;southeast:-87,24.4,-75,37;northeast:-87,37,-66.9,47.6;alaska:-179.9,51,-129.9,71.5;hawaii:-160.6,18.8,-154.7,22.4;baja:-118.6,22.8,-109.3,32.75'
      OSM_EXTRACTS: 'pacific=US;mountain=US;plains=US;central=US;southeast=US;northeast=US;alaska=US;hawaii=US;baja=https://download.geofabrik.de/north-america/mexico-latest.osm.pbf'
      MIN_CONF: '0.6'
      MAX_ROWS: '100000000'
    steps:
      - name: The US map file for every US region
        run: echo "OSM_EXTRACTS=${OSM_EXTRACTS//=US/=https://download.geofabrik.de/north-america/us-latest.osm.pbf}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -af >/dev/null || true
          sudo mkdir -p /mnt/pl && sudo chmod 777 /mnt/pl
          df -h / /mnt | tail -2; free -g | head -2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool zstd
      - run: pip install -q duckdb
      - name: Build the place file
        working-directory: /mnt/pl
        env:
          OUT_DB: /mnt/pl/places.db
        run: |
          python $GITHUB_WORKSPACE/scripts/places/build_places.py
          python - <<'EOF'
          import sqlite3; c = sqlite3.connect('/mnt/pl/places.db')
          n = c.execute('select count(*) from places').fetchone()[0]
          hit = c.execute("select count(*) from names where names match 'norm : starbucks'").fetchone()[0]
          print(f'::notice::{n:,} places, {hit:,} named like starbucks')
          assert n > 5000000 and hit > 1000, 'place file looks empty'
          EOF
          ls -la /mnt/pl/places.db
      - name: Package
        run: |
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          zstd -T0 -12 --long=27 /mnt/pl/places.db -o "$out/places.db.zst" && rm /mnt/pl/places.db
          cd "$out" && split -b 1900m -d places.db.zst places.part. && rm places.db.zst && ls -la
          echo "::notice::place file $(du -ch places.part.* | tail -1 | cut -f1) packed, $(ls places.part.* | wc -l) part(s)"
      - name: Publish
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=places-$(date -u +%Y%m%d-%H%M)
          gh release create "$tag" "$RUNNER_TEMP"/out/places.part.* --repo "$GITHUB_REPOSITORY" --title "Places $(date -u +%Y-%m-%d)" \
            --notes "BrinaMaps place list built from Overture Maps (CDLA-Permissive-2.0 / ODbL) and OpenStreetMap (© OpenStreetMap contributors, ODbL). Downloaded by the BrinaMaps route server." --latest=false
          # keep the two newest builds
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | grep '^places-' | sort -r | tail -n +3 | while read t; do gh release delete "$t" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag; done
          echo "::notice::published $tag"
